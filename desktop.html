    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, push, set, onChildAdded, remove, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { Editor } from 'https://esm.sh/@tiptap/core'
        import StarterKit from 'https://esm.sh/@tiptap/starter-kit'
        import Placeholder from 'https://esm.sh/@tiptap/extension-placeholder'
        import Image from 'https://esm.sh/@tiptap/extension-image'
        import Link from 'https://esm.sh/@tiptap/extension-link'

        const firebaseConfig = {
            apiKey: "AIzaSyDn5BUZDc4d1Tm0a5jTqAKBhjbDJQM6x8Y",
            authDomain: "thoughts-cc393.firebaseapp.com",
            databaseURL: "https://thoughts-cc393-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "thoughts-cc393",
            storageBucket: "thoughts-cc393.firebasestorage.app",
            messagingSenderId: "246796483340",
            appId: "1:246796483340:web:17f681ef495630a4122729"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const database = getDatabase(app);
        const provider = new GoogleAuthProvider();
        let db, currentUser = null;
        let searchQuery = "";
        let editingMemoId = null;

        // --- Modal Helper ---
        const modalOverlay = document.getElementById('custom-modal-overlay');
        const modalInput = document.getElementById('modal-input');
        const modalTitle = document.getElementById('modal-title');
        const modalCancel = document.getElementById('modal-cancel');
        const modalConfirm = document.getElementById('modal-confirm');
        let modalCallback = null;

        window.showPrompt = (title, defaultValue, callback) => {
            modalTitle.innerText = title;
            modalInput.value = defaultValue || "";
            modalOverlay.classList.remove('hidden');
            modalOverlay.classList.add('flex');
            modalCallback = callback;
            setTimeout(() => modalInput.focus(), 100);
        };

        function closePrompt(success) {
            const value = modalInput.value;
            modalOverlay.classList.add('hidden');
            modalOverlay.classList.remove('flex');
            if (modalCallback) modalCallback(success ? value : null);
            modalCallback = null;
        }

        modalConfirm.onclick = () => closePrompt(true);
        modalCancel.onclick = () => closePrompt(false);

        // --- Core Functions ---
        const initDB = () => {
            const request = indexedDB.open('EchoPWA_Desktop_V1', 1);
            request.onupgradeneeded = (e) => {
                const d = e.target.result;
                const store = d.createObjectStore('memos', { keyPath: 'id', autoIncrement: true });
                store.createIndex('firebaseKey', 'firebaseKey', { unique: true });
            };
            request.onsuccess = (e) => {
                db = e.target.result;
                renderMemos();
                if (currentUser) startSmartSync();
            };
        };

        async function startSmartSync() {
            if (!currentUser || currentUser.email !== 'alexszhang@gmail.com') return;
            const memosRef = ref(database, 'memos');
            try {
                const snapshot = await get(memosRef);
                if (snapshot.exists()) {
                    const tx = db.transaction('memos', 'readwrite');
                    const store = tx.objectStore('memos');
                    const index = store.index('firebaseKey');
                    snapshot.forEach((child) => {
                        const firebaseKey = child.key;
                        const cloudMemo = child.val();
                        index.get(firebaseKey).onsuccess = (e) => {
                            const existing = e.target.result;
                            const memoToStore = { ...cloudMemo, firebaseKey, synced: true };
                            if (existing) {
                                memoToStore.id = existing.id;
                                store.put(memoToStore);
                            } else {
                                store.add(memoToStore);
                            }
                        };
                    });
                    tx.oncomplete = renderMemos;
                }
            } catch (e) { console.error("Sync Load Failed", e); }

            onChildAdded(memosRef, (snapshot) => {
                const firebaseKey = snapshot.key;
                const cloudMemo = snapshot.val();
                const tx = db.transaction('memos', 'readwrite');
                const store = tx.objectStore('memos');
                const index = store.index('firebaseKey');
                index.get(firebaseKey).onsuccess = (e) => {
                    if (e.target.result) return;
                    store.add({ ...cloudMemo, firebaseKey, synced: true });
                };
                tx.oncomplete = renderMemos;
            });
        }

        onAuthStateChanged(auth, (user) => {
            if (user && user.email.endsWith('@gmail.com')) {
                currentUser = user;
                if (db) startSmartSync();
            }
        });

        window.loginGoogle = () => signInWithPopup(auth, provider);

        let editor;
        function initEditor(elementId, content = "") {
            if (editor) editor.destroy();
            editor = new Editor({
                element: document.getElementById(elementId),
                extensions: [StarterKit, Image, Link, Placeholder.configure({ placeholder: '记录想法...' })],
                content: content,
                autofocus: 'end',
            });
        }

        window.createNewMemo = () => {
            const now = new Date();
            const timeStr = `${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
            const memo = {
                title: "未命名笔记",
                content: "",
                tags: ["随笔"],
                timestamp: Date.now(),
                synced: false
            };
            const tx = db.transaction('memos', 'readwrite');
            tx.objectStore('memos').add(memo).onsuccess = (e) => {
                editingMemoId = e.target.result;
                renderMemos();
                setTimeout(() => {
                    const card = document.querySelector(`[data-id="${editingMemoId}"]`);
                    if (card) {
                        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        initEditor(`editor-${editingMemoId}`, "");
                    }
                }, 100);
            };
        };

        window.saveCurrentEdit = async (id) => {
            if (!editor || editingMemoId !== id) return;
            const html = editor.getHTML();
            const text = editor.getText();

            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = html;
            const h1 = tempDiv.querySelector('h1');
            const title = h1 ? h1.innerText.trim() : "随笔 " + new Date().toLocaleDateString();
            if (h1) h1.remove();

            const tx = db.transaction('memos', 'readwrite');
            const store = tx.objectStore('memos');
            store.get(id).onsuccess = (e) => {
                const existing = e.target.result;
                const updated = { ...existing, title, content: tempDiv.innerHTML, timestamp: Date.now(), synced: false };
                store.put(updated).onsuccess = () => {
                    editingMemoId = null;
                    renderMemos();
                    trySyncToFirebase(updated);
                };
            };
        };

        async function trySyncToFirebase(memo) {
            if (!currentUser || currentUser.email !== 'alexszhang@gmail.com') return;
            try {
                const memosRef = ref(database, 'memos');
                let memoRef = memo.firebaseKey ? ref(database, `memos/${memo.firebaseKey}`) : push(memosRef);
                const firebaseKey = memo.firebaseKey || memoRef.key;
                await set(memoRef, { ...memo, synced: true, firebaseKey });

                const tx = db.transaction('memos', 'readwrite');
                tx.objectStore('memos').put({ ...memo, synced: true, firebaseKey });
                tx.oncomplete = renderMemos;
            } catch (e) { console.warn("Sync Failed", e); }
        }

        window.deleteDesktopMemo = async (id, e) => {
            e.stopPropagation();
            if (!confirm("确定删除？")) return;
            const tx = db.transaction('memos', 'readwrite');
            tx.objectStore('memos').delete(id).onsuccess = renderMemos;
            // Simplified delete (local only for now in desktop POC, or port full logic if needed)
        };

        window.toggleEdit = (id, content) => {
            if (editingMemoId === id) return;
            if (editingMemoId) saveCurrentEdit(editingMemoId);
            editingMemoId = id;
            renderMemos();
            setTimeout(() => initEditor(`editor-${id}`, content), 50);
        };

        function renderMemos() {
            if (!db) return;
            db.transaction('memos', 'readonly').objectStore('memos').getAll().onsuccess = (e) => {
                let memos = e.target.result.sort((a, b) => b.timestamp - a.timestamp);
                const list = document.getElementById('memo-list-content');
                list.innerHTML = memos.map(m => {
                    const isEditing = editingMemoId === m.id;
                    return `
                    <div data-id="${m.id}" onclick="toggleEdit(${m.id}, '${m.content.replace(/'/g, "\\'")}')" 
                        class="${isEditing ? 'note-card-selected' : 'border border-gray-100 hover:border-gray-200'} p-8 rounded-2xl shadow-sm relative group cursor-pointer transition-all">
                        <div class="flex justify-between items-start mb-4">
                            <div class="flex items-center gap-3">
                                <span class="w-3 h-3 ${isEditing ? 'bg-primary' : 'border-2 border-primary'} rounded-full"></span>
                                <h2 class="text-2xl font-bold ${!m.content && !isEditing ? 'text-text-dim' : ''}">${m.title}</h2>
                            </div>
                            <div class="flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                <button onclick="deleteDesktopMemo(${m.id}, event)" class="p-1.5 text-text-dim hover:text-red-500">
                                    ${getIcon('trash', 'w-5 h-5')}
                                </button>
                                ${isEditing ? `<button onclick="saveCurrentEdit(${m.id})" class="p-1.5 text-primary">保存</button>` : ''}
                            </div>
                        </div>
                        <div id="editor-${m.id}" class="prose max-w-none text-text-main text-lg mb-4">
                            ${!isEditing ? m.content || '<p class="text-text-dim">暂无内容，点击编辑...</p>' : ''}
                        </div>
                        ${isEditing ? `<div class="absolute bottom-4 left-0 w-1 bg-primary h-8 rounded-r"></div>` : ''}
                        <div class="flex items-center justify-between pt-4 border-t ${isEditing ? 'border-primary/10' : 'border-gray-50'}">
                            <div class="flex gap-2 flex-wrap">
                                ${(m.tags || []).map(tag => `<span class="text-primary text-[11px] font-bold bg-primary/10 px-2.5 py-1 rounded-lg">#${tag}</span>`).join('')}
                            </div>
                            <span class="text-[10px] text-gray-400 font-medium uppercase tracking-tighter">
                                ${new Date(m.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                            </span>
                        </div>
                    </div>
                    `;
                }).join('');
            };
        }

        initDB();
        // Bind UI
        document.getElementById('global-add-btn').onclick = createNewMemo;
    </script>
</body>

</html>
